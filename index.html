r;gap:9px;align-self:flex-end;margin:0 0 1px;z-index:1}.day-dot{display:flex;align-items:center;flex-direction:column;gap:7px;color:#bdd0c3;font-size:9px}.day-dot i{width:18px;height:18px;border:1px solid #839c8c;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px}.day-dot.done i{background:var(--lime);color:var(--green);border-color:var(--lime)}.day-dot.today{color:white}.day-dot.today i{border-color:white}.sun-art{position:absolute;width:112px;height:112px;border-radius:50%;border:1px solid rgba(214,233,155,.16);right:-24px;top:-42px}.sun-art span{position:absolute;width:55px;height:55px;border-radius:50%;background:rgba(214,233,155,.11);left:28px;top:28px}.sun-art i{position:absolute;width:80px;height:80px;border:1px solid rgba(214,233,155,.12);border-radius:50%;left:15px;top:15px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:34px 0 16px}.section-head h2{font-size:20px;letter-spacing:-.5px;margin:6px 0 0;font-weight:700}.step-tag{font-size:10px;color:#879082;padding-bottom:3px}.log-card{background:var(--white);border-radius:13px;padding:22px 22px 20px;box-shadow:0 6px 25px rgba(42,49,40,.035)}.field-label{font-size:12px;font-weight:700;display:flex;align-items:center;gap:9px}.field-number{font-size:9px;color:#9ca694;font-weight:600;letter-spacing:1px}.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{border:1px solid var(--line);background:transparent;color:#737b72;border-radius:20px;padding:7px 13px;font:inherit;font-size:11px;cursor:pointer;transition:.2s}.chip:hover{border-color:#91aa8b}.chip.selected{background:var(--green);color:white;border-color:var(--green)}.divider{height:1px;background:#efeee8;margin:19px 0}.exercise-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-top:11px;padding:0 11px}.exercise-wrap input{height:39px;flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:12px;color:var(--ink)}.exercise-wrap input::placeholder,textarea::placeholder{color:#b5b9ae}.suggest-btn{border:0;background:none;color:var(--green);font-size:10px;cursor:pointer;white-space:nowrap}.suggestions{display:flex;gap:7px;margin-top:9px}.suggestions button{border:0;border-radius:4px;background:#f4f4ed;color:#8a9084;padding:5px 8px;font:inherit;font-size:9px;cursor:pointer}.field-hint{font-size:9px;color:#a2a69c;font-weight:400;margin-left:auto}.count-row{display:flex;align-items:center;gap:7px;margin-top:12px}.count-step{width:32px;height:32px;border:1px solid var(--line);background:transparent;border-radius:7px;color:#63715f;font-size:18px;cursor:pointer}.count-row input{width:41px;border:0;outline:0;background:transparent;text-align:center;font-size:19px;font-weight:700;color:var(--ink);appearance:textfield}.count-row input::-webkit-inner-spin-button{appearance:none}.count-unit{font-size:10px;color:#8f9789;margin-left:-5px}.unit-toggle{display:flex;margin-left:auto;padding:3px;background:#f3f3ed;border-radius:7px;gap:2px}.unit{border:0;background:none;padding:6px 9px;border-radius:5px;font:inherit;font-size:10px;color:#858b81;cursor:pointer}.unit.active{background:white;color:var(--green);box-shadow:0 1px 4px #1f2d1a12}.note-label{display:block;font-size:11px;font-weight:700;margin-bottom:10px}.note-label span{color:#aab0a6;font-weight:400;margin-left:4px;font-size:9px}.feel-row{display:flex;gap:8px}.feel{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 9px;color:#81877d;font:inherit;font-size:10px;cursor:pointer}.feel span{margin-left:3px}.feel.active{border-color:#b4c9a3;background:#f5f8ed;color:#466548}.log-card textarea{display:block;resize:none;width:100%;margin-top:9px;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;padding:8px 0;font:inherit;font-size:11px}.save-btn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:17px;background:var(--green);color:white;border:0;border-radius:7px;padding:13px 15px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}.save-btn:hover{background:#254938;transform:translateY(-1px)}.save-arrow{font-size:16px;color:var(--lime)}.progress-section{padding-top:6px}.history-head{margin-top:39px}.total-badge{background:#eaece3;color:#788570;border-radius:20px;padding:6px 10px;font-size:9px;margin-bottom:2px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat-card{position:relative;display:flex;flex-direction:column;background:var(--white);border:1px solid #eeede6;border-radius:9px;padding:13px 12px 11px;min-height:102px}.stat-icon{position:absolute;right:10px;top:10px;width:22px;height:22px;display:grid;place-items:center;border-radius:7px;font-size:13px}.mint{background:#e6f0df;color:#52714d}.peach{background:#fae9df;color:#bd7753}.lilac{background:#ece9f2;color:#796b98}.stat-caption{font-size:9px;color:#989e92;margin-top:3px}.stat-card strong{font-size:24px;margin-top:auto;line-height:1.2}.stat-card strong small{font-size:10px;font-weight:400;color:#969d90;margin-left:3px}.stat-word{font-size:15px!important;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.history-title h3{font-size:13px;margin:0}.text-button{border:0;background:none;color:#a0a497;font:inherit;font-size:10px;cursor:pointer}.history-list{display:flex;flex-direction:column;gap:8px}.history-item{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid #eeede6;border-radius:9px;padding:12px}.history-symbol{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#eff2e8;color:#56724e;font-size:15px}.history-main{flex:1;min-width:0}.history-main strong{display:block;font-size:12px}.history-main small{display:block;font-size:9px;color:#9ba195;margin-top:4px}.history-meta{text-align:right;color:var(--green);font-size:11px;font-weight:700}.history-meta small{display:block;color:#a2a79c;font-weight:400;font-size:9px;margin-top:4px}.empty-state{text-align:center;padding:22px 10px 10px;color:#a0a69a}.empty-icon{margin:0 auto 9px;width:34px;height:34px;border:1px solid #dce3d5;color:#8aa27c;border-radius:50%;display:grid;place-items:center}.empty-state strong{font-size:11px;color:#737e70}.empty-state p{font-size:10px;margin:6px 0}footer{margin-top:35px;border-top:1px solid #e7e6de;padding-top:15px;color:#a0a397;font-size:9px;display:flex;justify-content:space-between}footer span{letter-spacing:1px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#263f33;color:white;padding:11px 18px;border-radius:22px;font-size:12px;box-shadow:0 8px 25px #24362b33;transition:.25s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.app-shell{padding-left:42px;padding-right:42px}.welcome{padding-top:52px}.welcome h1{font-size:54px}.streak-card{min-height:162px}.log-card{padding:26px}.section-head{margin-top:39px}}
@media(max-width:520px){.app-shell{padding:0 20px 30px}.topbar{height:69px}.welcome{padding:34px 0 24px}.welcome h1{font-size:43px}.streak-card{min-height:140px;padding:18px}.week-dots{gap:6px}.day-dot i{width:16px;height:16px}.day-dot{font-size:8px}.log-card{padding:19px 16px}.section-head{margin-top:29px}.stat-card{padding:11px 9px;min-height:94px}.stat-icon{right:8px;top:8px;width:20px;height:20px}.stat-caption{font-size:8px}.stat-card strong{font-size:22px}.unit{padding:6px 8px}.feel-row{gap:5px}.feel{padding:7px 8px;font-size:9px}}
.side-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#949b8f;font-size:10px}.side-toggle{display:flex;gap:4px}.side-option{border:1px solid var(--line);background:transparent;color:#858b81;border-radius:16px;padding:5px 11px;font:inherit;font-size:10px;cursor:pointer}.side-option.active{background:#edf2e8;border-color:#c8d8bd;color:var(--green)}.library-head{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:9px;color:#9aa092}.library-head button{border:0;background:none;color:var(--green);font:inherit;font-size:9px;cursor:pointer}.library{display:none;background:#f7f7f2;border-radius:7px;padding:11px 10px;margin-top:8px}.library.open{display:block}.library-category{display:grid;grid-template-columns:33px 1fr;gap:8px;align-items:start;margin-bottom:9px}.library-category:last-child{margin-bottom:0}.library-category>span{font-size:9px;color:#9ba195;padding-top:6px}.library-items{display:flex;flex-wrap:wrap;gap:5px}.library-items button{border:1px solid #e7e9df;background:#fffefa;color:#687364;border-radius:5px;padding:5px 7px;font:inherit;font-size:9px;cursor:pointer}.library-items button:hover{border-color:#a5bb98;color:var(--green)}
.history-actions{display:flex;align-items:center;gap:13px}.export-button{border:1px solid #dfe5d8;background:#f2f5ed;color:#52704c;border-radius:15px;padding:6px 10px;font:inherit;font-size:9px;cursor:pointer}.export-button:hover{background:#e8efdf}

<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="复元首页"><span class="brand-mark">↗</span><span>复元<span class="brand-dot">.</span></span></a>
      <div class="top-date" id="todayLabel"></div>
      <button class="avatar" aria-label="运动员">林</button>
    </header>

    <section class="welcome" id="top">
      <div class="eyebrow"><span class="live-dot"></span> TRAIN · RECOVER · REPEAT</div>
      <h1>每一次恢复，<br><em>都算数。</em></h1>
      <p>训练之后，花一点时间照顾身体。</p>
    </section>

    <section class="streak-card">
      <div class="streak-copy"><div class="streak-label">本周恢复记录</div><div class="streak-number"><strong id="weekCount">0</strong><span> / 7 天</span></div><div class="streak-note" id="streakNote">今天的恢复，还没被记录</div></div>
      <div class="week-dots" id="weekDots"></div>
      <div class="sun-art" aria-hidden="true"><span></span><i></i></div>
    </section>

    <section class="section-head">
      <div><span class="eyebrow">QUICK LOG</span><h2>记下这次恢复</h2></div>
      <span class="step-tag">约 15 秒</span>
    </section>

    <section class="log-card">
      <div class="field-label"><span class="field-number">01</span>恢复部位</div>
      <div class="chip-row" id="bodyParts">
        <button class="chip selected" data-value="下肢">下肢</button><button class="chip" data-value="膝盖">膝盖</button><button class="chip" data-value="髋部">髋部</button><button class="chip" data-value="脚踝">脚踝</button><button class="chip" data-value="上肢">上肢</button><button class="chip" data-value="核心">核心</button>
      </div>
      <div class="side-row" id="sideRow"><span>左右侧</span><div class="side-toggle"><button class="side-option active" data-side="双侧">双侧</button><button class="side-option" data-side="左侧">左侧</button><button class="side-option" data-side="右侧">右侧</button></div></div>
      <div class="divider"></div>
      <div class="field-label"><span class="field-number">02</span>做了什么动作</div>
      <div class="exercise-wrap"><input id="exercise" type="text" placeholder="例如：弹力带侧步" maxlength="32" autocomplete="off" /><button class="suggest-btn" id="suggestBtn" type="button">换一个 ↻</button></div>
      <div class="library-head"><span id="libraryHeadLabel">下肢 · 常用动作</span><button type="button" id="libraryToggle" aria-expanded="false">展开全部⌄</button></div>
      <div class="library" id="library"></div>
      <div class="divider"></div>
      <div class="field-label"><span class="field-number">03</span>完成次数 <span class="field-hint">组 / 次 / 分钟都可以</span></div>
      <div class="count-row"><button class="count-step" id="minus" aria-label="减少">−</button><input id="count" type="number" min="1" max="999" value="3" inputmode="numeric" /><span class="count-unit">组</span><button class="count-step" id="plus" aria-label="增加">＋</button><div class="unit-toggle"><button class="unit active" data-unit="组">组</button><button class="unit" data-unit="次">次</button><button class="unit" data-unit="分钟">分</button></div></div>
      <div class="divider"></div>
      <label class="note-label" for="note">身体感觉 <span>选填</span></label>
      <div class="feel-row" id="feelings"><button class="feel active" data-feel="轻松">☀️ <span>轻松</span></button><button class="feel" data-feel="刚好">👌 <span>刚好</span></button><button class="feel" data-feel="有点紧">〰️ <span>有点紧</span></button></div>
      <textarea id="note" rows="1" placeholder="补充一句感受，例如：左膝有些紧"></textarea>
      <button class="save-btn" id="saveBtn"><span>保存这次记录</span><span class="save-arrow">↗</span></button>
    </section>

    <section class="progress-section">
      <div class="section-head history-head"><div><span class="eyebrow">YOUR PROGRESS</span><h2>慢慢积累的进步</h2></div><span class="total-badge" id="totalBadge">0 次记录</span></div>
      <div class="stats-grid"><div class="stat-card"><span class="stat-icon mint">↗</span><span class="stat-caption">累计恢复</span><strong id="totalSessions">0<small>次</small></strong></div><div class="stat-card"><span class="stat-icon peach">◷</span><span class="stat-caption">本周恢复</span><strong id="weekSessions">0<small>次</small></strong></div><div class="stat-card"><span class="stat-icon lilac">✳</span><span class="stat-caption">最常照顾</span><strong class="stat-word" id="topPart">—</strong></div></div>
      <div class="history-title"><h3>最近记录</h3><div class="history-actions"><button id="exportBtn" class="export-button">↓ 导出表格</button><button id="clearBtn" class="text-button">清空</button></div></div>
      <div class="history-list" id="historyList"></div>
      <div class="empty-state" id="emptyState"><div class="empty-icon">✳</div><strong>你的第一条记录，等你来写</strong><p>每一次认真恢复，都会在这里留下痕迹。</p></div>
    </section>
    <footer>照顾身体，是训练的一部分。<span>复元 · 01</span></footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
const STORE_KEY = 'fuyuan-recovery-v1';
const weekdays = ['日','一','二','三','四','五','六'];
const exerciseLibrary = {
  '下肢': { '热身与活动度':['下肢动态拉伸','腿后侧动态摆腿','深蹲踝关节活动','弓步转体','髋关节绕环'], '放松':['下肢泡沫轴滚压','腿后侧拉伸','股四头肌拉伸','内收肌拉伸','小腿拉伸'], '激活与控制':['徒手臀桥','弹力带侧步','箱式深蹲','反向弓步','单腿硬拉触地'] },
  '膝盖': { '活动度与放松':['膝关节屈伸活动','股四头肌泡沫轴滚压','股四头肌拉伸','腘绳肌拉伸','小腿后侧拉伸'], '激活与力量':['股四头肌等长收缩','直腿抬高','弹力带终末伸膝','坐姿伸膝','台阶上步'], '平衡与控制':['靠墙静蹲','浅蹲控制','单腿站立','前向台阶下蹲','反向弓步'] },
  '髋部': { '活动度与放松':['髋关节绕环','90/90髋部转换','髋屈肌拉伸','臀肌拉伸','臀肌泡沫轴放松'], '激活与力量':['臀桥','单腿臀桥','蚌式开合','弹力带侧步','四点跪姿后抬腿'], '稳定与控制':['单腿硬拉触地','侧卧髋外展','侧向弓步','鸟狗式','髋外旋弹力带'] },
  '脚踝': { '活动度与放松':['踝关节绕环','膝触墙踝背屈','小腿后侧拉伸','比目鱼肌拉伸','足底滚压'], '激活与力量':['双脚提踵','单脚提踵','弹力带勾脚','弹力带绷脚','脚趾抓毛巾'], '平衡与控制':['单腿平衡','单腿平衡触地','前后重心转移','单腿提踵平衡','星形触地'] },
  '上肢': { '活动度与放松':['肩关节绕环','胸椎旋转','胸肌门框拉伸','背阔肌拉伸','肩部泡沫轴放松'], '激活与力量':['弹力带肩外旋','弹力带划船','肩胛俯卧撑','墙面滑手','俯身Y字抬手'], '稳定与控制':['四点跪姿肩碰触','单臂弹力带推举','肩胛绕环','靠墙天使','侧卧肩外旋'] },
  '核心': { '激活与力量':['死虫式','鸟狗式','臀桥','前臂平板支撑','侧平板支撑'], '稳定与控制':['仰卧交替点脚','四点跪姿伸展','Pallof抗旋推','熊爬支撑位肩碰触','单侧负重行走'], '放松与活动度':['猫牛式','婴儿式伸展','仰卧躯干旋转','胸椎旋转','腹式呼吸'] }
};
let records = loadRecords();
let selectedPart = '下肢';
let selectedSide = '双侧';
let selectedUnit = '组';
let selectedFeel = '轻松';

const $ = id => document.getElementById(id);
function loadRecords(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch{return []}}
function saveRecords(){localStorage.setItem(STORE_KEY,JSON.stringify(records))}
function dateKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function formatDate(key){const d=new Date(`${key}T12:00:00`);return `${d.getMonth()+1}月${d.getDate()}日`}
function formatTime(timestamp){if(!timestamp)return '时间未记录';const d=new Date(timestamp);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function formatDateTime(timestamp,date){if(!timestamp)return `${date} 时间未记录`;const d=new Date(timestamp);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function formatHistoryDateTime(timestamp,date){if(!timestamp)return `${formatDate(date)} 时间未记录`;const d=new Date(timestamp);return `${d.getMonth()+1}月${d.getDate()}日 ${formatTime(timestamp)}`}
function setToday(){const d=new Date();$('todayLabel').textContent=`${d.getFullYear()} · ${String(d.getMonth()+1).padStart(2,'0')} / ${String(d.getDate()).padStart(2,'0')}`}
function renderWeek(){const now=new Date();const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));const keys=[];for(let i=0;i<7;i++){const day=new Date(start);day.setDate(start.getDate()+i);keys.push(dateKey(day))}const unique=new Set(records.map(r=>r.date));const count=keys.filter(k=>unique.has(k)).length;$('weekCount').textContent=count;$('weekSessions').innerHTML=`${records.filter(r=>keys.includes(r.date)).length}<small>次</small>`;$('streakNote').textContent=unique.has(dateKey())?'今天已经照顾好自己 ✓':count?'本周已经为自己留下足迹':'每一次开始，都值得记下';$('weekDots').innerHTML=keys.map((k,i)=>`<div class="day-dot ${unique.has(k)?'done':''} ${k===dateKey()?'today':''}"><i>${unique.has(k)?'✓':''}</i><span>${weekdays[(i+1)%7]}</span></div>`).join('')}
function renderHistory(){const sorted=[...records].sort((a,b)=>b.createdAt-a.createdAt);$('totalSessions').innerHTML=`${records.length}<small>次</small>`;$('totalBadge').textContent=`${records.length} 次记录`;const parts={};records.forEach(r=>parts[r.part]=(parts[r.part]||0)+1);const top=Object.entries(parts).sort((a,b)=>b[1]-a[1])[0];$('topPart').textContent=top?top[0]:'—';$('historyList').innerHTML=sorted.slice(0,12).map(r=>`<article class="history-item"><div class="history-symbol">✳</div><div class="history-main"><strong>${escapeHtml(r.exercise)}</strong><small>${escapeHtml(r.part)} · ${escapeHtml(r.side||'双侧')} · ${r.feel}${r.note?` · ${escapeHtml(r.note)}`:''}</small></div><div class="history-meta">${r.count} ${r.unit}<small>${formatHistoryDateTime(r.createdAt,r.date)}</small></div></article>`).join('');$('emptyState').style.display=records.length?'none':'block';$('clearBtn').style.visibility=records.length?'visible':'hidden'}
function renderLibrary(){const groups=exerciseLibrary[selectedPart]||{};$('library').innerHTML=Object.entries(groups).map(([category,names])=>`<div class="library-category"><span>${category}</span><div class="library-items">${names.map(name=>`<button type="button" data-name="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join('')}</div></div>`).join('');$('libraryHeadLabel').textContent=`${selectedPart} · 常用动作`;document.querySelectorAll('.library-items button').forEach(btn=>btn.addEventListener('click',()=>{$('exercise').value=btn.dataset.name}))}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderWeek();renderHistory()}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300)}
document.querySelectorAll('#bodyParts .chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('#bodyParts .selected').classList.remove('selected');btn.classList.add('selected');selectedPart=btn.dataset.value;renderLibrary()}));
document.querySelectorAll('.side-option').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.side-option.active').classList.remove('active');btn.classList.add('active');selectedSide=btn.dataset.side}));
document.querySelectorAll('.unit').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.unit.active').classList.remove('active');btn.classList.add('active');selectedUnit=btn.dataset.unit;$('count').nextElementSibling.textContent=selectedUnit==='分钟'?'分':selectedUnit}));
document.querySelectorAll('.feel').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.feel.active').classList.remove('active');btn.classList.add('active');selectedFeel=btn.dataset.feel}));
$('libraryToggle').addEventListener('click',()=>{const open=$('library').classList.toggle('open');$('libraryToggle').textContent=open?'收起⌃':'展开全部⌄';$('libraryToggle').setAttribute('aria-expanded',String(open))});
$('suggestBtn').addEventListener('click',()=>{const names=Object.values(exerciseLibrary[selectedPart]).flat();$('exercise').value=names[Math.floor(Math.random()*names.length)]});
$('minus').addEventListener('click',()=>{$('count').value=Math.max(1,(Number($('count').value)||1)-1)});
$('plus').addEventListener('click',()=>{$('count').value=Math.min(999,(Number($('count').value)||0)+1)});
$('saveBtn').addEventListener('click',()=>{const exercise=$('exercise').value.trim();const count=Math.max(1,Math.min(999,Number($('count').value)||0));if(!exercise){$('exercise').focus();toast('先写下做了什么动作吧');return}const now=Date.now();records.push({id:crypto.randomUUID?crypto.randomUUID():String(now),part:selectedPart,side:selectedSide,exercise,count,unit:selectedUnit,feel:selectedFeel,note:$('note').value.trim(),date:dateKey(new Date(now)),createdAt:now});saveRecords();render();$('exercise').value='';$('note').value='';$('count').value=3;toast('记下了！认真恢复的你，很棒。')});
$('clearBtn').addEventListener('click',()=>{if(!records.length)return;if(confirm('清空所有康复记录？此操作无法撤销。')){records=[];saveRecords();render();toast('记录已清空')}});
$('exportBtn').addEventListener('click',()=>{if(!records.length){toast('还没有记录可以导出');return}const columns=['记录时间（本地）','部位','左右侧','动作','数量','单位','身体感觉','备注'];const rows=records.slice().sort((a,b)=>a.createdAt-b.createdAt).map(r=>[`${formatDateTime(r.createdAt,r.date)}（本地）`,r.part,r.side||'双侧',r.exercise,r.count,r.unit,r.feel,r.note||'']);const csv=[columns,...rows].map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`康复记录_${dateKey()}.csv`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);toast('表格已导出，记录时间精确到分钟')});
setToday();renderLibrary();render();

  </script>
</body>
</html>
